<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ethnic composition compared across countries (grouped bar)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 16px; }
  h1 { font-size: 18px; margin-bottom: 2px; }
  #sub { color: #555; font-size: 12px; margin: 0 0 8px; }
  #legend { margin: 0 0 8px; font-size: 11px; }
  #legend .lg { display: inline-flex; align-items: center; margin: 0 10px 4px 0; }
  #legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; }
  .domain, .tick line { stroke: #ccc; }
  #tip { position: absolute; opacity: 0; pointer-events: none; background: rgba(0,0,0,0.82);
         color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; line-height: 1.4; }
</style>
</head>
<body>
<h1>Ethnic composition compared across countries (grouped bar)</h1>
<p id="sub">Clusters of country; one bar per name (height = percentage), compared side by side. Showing the comparable core: top 12 of 241 country × top 8 of 496 name by coverage; dropped 229 groups and 488 rarer segments (completeness per the paper).</p>
<div id="legend"></div>
<div id="chart"></div>
<div id="tip"></div>
<script>
const rows = [{"__group": "JA", "European": 0.2, "Arab": 0.0, "African": 92.1, "Indian": 0.8, "Chinese": 0.2, "Mulatto": 6.1, "Mestizo": 0.0, "Russian": 0.0}, {"__group": "C", "European": 58.0, "Arab": 0.0, "African": 9.3, "Indian": 0.0, "Chinese": 1.0, "Mulatto": 16.0, "Mestizo": 12.0, "Russian": 0.0}, {"__group": "TT", "European": 0.6, "Arab": 0.2, "African": 36.3, "Indian": 37.6, "Chinese": 0.3, "Mulatto": 0.0, "Mestizo": 0.0, "Russian": 0.0}, {"__group": "SME", "European": 0.3, "Arab": 0.0, "African": 21.7, "Indian": 27.4, "Chinese": 1.5, "Mulatto": 15.7, "Mestizo": 0.0, "Russian": 0.0}, {"__group": "USA", "European": 0.0, "Arab": 0.6, "African": 13.6, "Indian": 1.0, "Chinese": 1.2, "Mulatto": 0.0, "Mestizo": 16.1, "Russian": 0.0}, {"__group": "ARU", "European": 10.0, "Arab": 0.0, "African": 15.0, "Indian": 0.0, "Chinese": 0.0, "Mulatto": 25.0, "Mestizo": 50.0, "Russian": 0.0}, {"__group": "DOM", "European": 13.5, "Arab": 0.0, "African": 15.8, "Indian": 0.0, "Chinese": 0.0, "Mulatto": 12.4, "Mestizo": 58.0, "Russian": 0.0}, {"__group": "BDS", "European": 2.7, "Arab": 0.0, "African": 92.4, "Indian": 1.3, "Chinese": 0.0, "Mulatto": 3.1, "Mestizo": 0.0, "Russian": 0.0}, {"__group": "YV", "European": 43.6, "Arab": 0.0, "African": 2.9, "Indian": 0.0, "Chinese": 1.4, "Mulatto": 0.0, "Mestizo": 51.6, "Russian": 0.0}, {"__group": "WL", "European": 1.0, "Arab": 0.0, "African": 85.3, "Indian": 2.2, "Chinese": 0.0, "Mulatto": 10.9, "Mestizo": 0.0, "Russian": 0.0}, {"__group": "MNTS", "European": 2.7, "Arab": 0.0, "African": 88.4, "Indian": 1.5, "Chinese": 0.0, "Mulatto": 6.7, "Mestizo": 0.0, "Russian": 0.0}, {"__group": "TUCA", "European": 7.9, "Arab": 0.0, "African": 87.6, "Indian": 1.3, "Chinese": 0.0, "Mulatto": 2.5, "Mestizo": 0.0, "Russian": 0.0}];
const segments = ["European", "Arab", "African", "Indian", "Chinese", "Mulatto", "Mestizo", "Russian"];
const segmentName = "name", valueName = "percentage";
const width = 920, height = 460;

const margin = {top: 24, right: 20, bottom: 96, left: 56};
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

const x0 = d3.scaleBand().domain(rows.map(d => d.__group)).range([0, innerW]).paddingInner(0.25);
const x1 = d3.scaleBand().domain(segments).range([0, x0.bandwidth()]).padding(0.05);
const maxV = d3.max(rows, d => d3.max(segments, k => d[k] || 0)) || 1;
const y = d3.scaleLinear().domain([0, maxV]).nice().range([innerH, 0]);
const palette = d3.quantize(d3.interpolateRainbow, Math.max(2, segments.length));
const color = d3.scaleOrdinal().domain(segments).range(palette);

g.append("g").call(d3.axisLeft(y).ticks(6));
g.append("g").attr("transform", `translate(0,${innerH})`).call(d3.axisBottom(x0))
  .selectAll("text").attr("transform", "rotate(-40)").style("text-anchor", "end").style("font-size", "9px");

const tip = d3.select("#tip");
const moveTip = (event) => tip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY + 12) + "px");

const cluster = g.append("g").selectAll("g").data(rows).join("g")
  .attr("transform", d => `translate(${x0(d.__group)},0)`);
const rect = cluster.selectAll("rect")
  .data(d => segments.map(k => ({group: d.__group, key: k, value: d[k] || 0}))).join("rect")
  .attr("x", d => x1(d.key))
  .attr("y", d => y(d.value))
  .attr("width", x1.bandwidth())
  .attr("height", d => innerH - y(d.value))
  .attr("fill", d => color(d.key))
  .attr("fill-opacity", 0.9);

rect
  .on("mouseover", (event, d) => {
    rect.attr("fill-opacity", r => r.key === d.key ? 0.95 : 0.18);
    tip.style("opacity", 1).html("<strong>" + d.group + "</strong><br>" + segmentName + ": " + d.key + "<br>" + valueName + ": " + d.value);
    moveTip(event);
  })
  .on("mousemove", moveTip)
  .on("mouseout", () => { rect.attr("fill-opacity", 0.9); tip.style("opacity", 0); });

const legend = d3.select("#legend");
segments.forEach(s => {
  const item = legend.append("span").attr("class", "lg");
  item.append("span").attr("class", "sw").style("background", color(s));
  item.append("span").text(s);
});
</script>
</body>
</html>
