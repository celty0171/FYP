  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      color: #ffffff;
      text-align: center;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #8a8fa8;
      margin-bottom: 28px;
      text-align: center;
    }

    #chart-container {
      background: #181b26;
      border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.55);
      padding: 20px 10px;
      width: 100%;
      max-width: 1100px;
      overflow-x: auto;
    }

    svg { display: block; margin: 0 auto; }

    .node rect {
      rx: 4;
      ry: 4;
      stroke-width: 0;
    }

    .node text {
      font-size: 11.5px;
      fill: #d8dce8;
      pointer-events: none;
    }

    .link {
      fill: none;
      stroke-opacity: 0.28;
      transition: stroke-opacity 0.2s;
    }

    .link:hover { stroke-opacity: 0.62; }

    .tooltip {
      position: fixed;
      background: rgba(20, 22, 34, 0.96);
      border: 1px solid #3a3f58;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12.5px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      color: #e8eaf6;
      line-height: 1.7;
      z-index: 999;
      max-width: 220px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      justify-content: center;
      margin-top: 22px;
      max-width: 900px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: #b0b4c8;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }
  </style>

// ─── Colour palette per continent ───────────────────────────────────────────
const continentColour = {
  "Europe":            "#4e79d4",
  "Asia":              "#e05c2a",
  "Africa":            "#2ecc71",
  "North America":     "#f39c12",
  "South America":     "#9b59b6",
  "Australia/Oceania": "#1abc9c"
};

const continents = Object.keys(continentColour);

// Assign a colour to every node: continents use their fixed colour,
// countries inherit the colour of their (first / dominant) continent.
function dominantContinent(country) {
  const rows = rawData.filter(d => d.country === country);
  rows.sort((a, b) => b.percentage - a.percentage);
  return rows[0].continent;
}

// ─── Build Sankey graph data ─────────────────────────────────────────────────
const nodeNames = [];
const nodeIndex = {};

function getOrAdd(name) {
  if (!(name in nodeIndex)) {
    nodeIndex[name] = nodeNames.length;
    nodeNames.push(name);
  }
  return nodeIndex[name];
}

// Add continents first (right side), then countries (left side)
continents.forEach(c => getOrAdd(c));
const uniqueCountries = [...new Set(rawData.map(d => d.country))];
uniqueCountries.forEach(c => getOrAdd(c));

const links = rawData.map(d => ({
  source: nodeIndex[d.country],
  target: nodeIndex[d.continent],
  value:  d.percentage,
  country: d.country,
  continent: d.continent
}));

const graph = {
  nodes: nodeNames.map(name => ({ name })),
  links
};

// ─── Layout ──────────────────────────────────────────────────────────────────
const margin = { top: 20, right: 160, bottom: 20, left: 160 };
const totalW  = Math.min(1060, window.innerWidth - 40);
const totalH  = Math.max(820, uniqueCountries.length * 5.6);
const W = totalW  - margin.left - margin.right;
const H = totalH  - margin.top  - margin.bottom;

const svg = d3.select("#sankey-svg")
  .attr("width",  totalW)
  .attr("height", totalH);

const g = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const sankey = d3.sankey()
  .nodeId(d => d.name)
  .nodeWidth(18)
  .nodePadding(4)
  .extent([[0, 0], [W, H]]);

const { nodes, links: sankeyLinks } = sankey({
  nodes: graph.nodes.map(d => Object.assign({}, d)),
  links: graph.links.map(d => Object.assign({}, d))
});

// ─── Colour helpers ──────────────────────────────────────────────────────────
function nodeColour(node) {
  if (continentColour[node.name]) return continentColour[node.name];
  return continentColour[dominantContinent(node.name)] || "#888";
}

function linkColour(link) {
  return continentColour[link.continent] || "#888";
}

// ─── Draw links ──────────────────────────────────────────────────────────────
g.append("g")
  .selectAll("path")
  .data(sankeyLinks)
  .join("path")
    .attr("class", "link")
    .attr("d", d3.sankeyLinkHorizontal())
    .attr("stroke", d => linkColour(d))
    .attr("stroke-width", d => Math.max(1, d.width))
    .on("mousemove", (event, d) => {
      tooltip
        .style("opacity", 1)
        .style("left",  (event.clientX + 14) + "px")
        .style("top",   (event.clientY - 28) + "px")
        .html(`<strong>${d.country}</strong> → <strong>${d.continent}</strong><br/>
               Percentage: <strong>${d.value}%</strong>`);
    })
    .on("mouseleave", () => tooltip.style("opacity", 0));

// ─── Draw nodes ──────────────────────────────────────────────────────────────
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
    .attr("class", "node");

node.append("rect")
  .attr("x",      d => d.x0)
  .attr("y",      d => d.y0)
  .attr("width",  d => d.x1 - d.x0)
  .attr("height", d => Math.max(1, d.y1 - d.y0))
  .attr("fill",   d => nodeColour(d))
  .attr("opacity", 0.92)
  .on("mousemove", (event, d) => {
    const isContinent = continents.includes(d.name);
    const total = isContinent
      ? rawData.filter(r => r.continent === d.name)
               .reduce((s, r) => s + r.percentage, 0).toFixed(1)
      : rawData.filter(r => r.country === d.name)
               .reduce((s, r) => s + r.percentage, 0).toFixed(1);
    tooltip
      .style("opacity", 1)
      .style("left",  (event.clientX + 14) + "px")
      .style("top",   (event.clientY - 28) + "px")
      .html(isContinent
        ? `<strong>Continent:</strong> ${d.name}<br/>Total weight: <strong>${total}</strong>`
        : `<strong>Country:</strong> ${d.name}<br/>Total weight: <strong>${total}%</strong>`);
  })
  .on("mouseleave", () => tooltip.style("opacity", 0));

// ─── Labels ──────────────────────────────────────────────────────────────────
node.append("text")
  .attr("x",           d => d.x0 < W / 2 ? d.x0 - 6 : d.x1 + 6)
  .attr("y",           d => (d.y0 + d.y1) / 2)
  .attr("dy",          "0.35em")
  .attr("text-anchor", d => d.x0 < W / 2 ? "end" : "start")
  .attr("font-size",   d => continents.includes(d.name) ? "13px" : "10.5px")
  .attr("font-weight", d => continents.includes(d.name) ? "700" : "400")
  .attr("fill",        d => continents.includes(d.name) ? "#ffffff" : "#c8cce0")
  .text(d => d.name);

// ─── Tooltip element ─────────────────────────────────────────────────────────
const tooltip = d3.select("#tooltip");

// ─── Legend ──────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
continents.forEach(c => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-swatch" style="background:${continentColour[c]}"></div>${c}`;
  legendEl.appendChild(item);
});
</script>
