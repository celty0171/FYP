<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sea merges_with arc diagram (edge count)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f7f8fa;
    color: #222;
    padding: 18px;
  }
  h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
  .subtitle {
    font-size: 0.80rem;
    color: #555;
    margin-bottom: 14px;
  }
  #chart-wrap {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.09);
    padding: 16px 10px;
    overflow: auto;
    display: inline-block;
    min-width: 100%;
  }
  svg { display: block; margin: 0 auto; }
  .arc-path {
    fill: none;
    stroke-linecap: round;
    transition: stroke-opacity 0.15s, stroke-width 0.15s;
  }
  .arc-path.dimmed { stroke-opacity: 0.04 !important; }
  .arc-path.highlighted { stroke-opacity: 0.92 !important; }
  .node-circle {
    stroke: #fff;
    stroke-width: 1.5px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .node-circle.dimmed { opacity: 0.18; }
  .node-label {
    font-size: 9px;
    fill: #333;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .node-label.dimmed { opacity: 0.18; }
  .axis-line {
    stroke: #ccc;
    stroke-width: 1px;
  }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(25,25,35,0.93);
    color: #fff;
    border-radius: 7px;
    padding: 8px 13px;
    font-size: 13px;
    line-height: 1.6;
    max-width: 340px;
    z-index: 9999;
    display: none;
    box-shadow: 0 3px 14px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>
<h1>Sea merges_with arc diagram (edge count)</h1>
<div class="subtitle">Arc thickness = count &middot; Node size &amp; colour = degree (# connections) &middot; Axis ordered to minimise arc spans (spectral + barycenter)</div>
<div id="chart-wrap">
  <svg id="arc-svg"></svg>
</div>
<div id="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- injected data ----
  const NAMES       = ["Yellow Sea", "Sea of Japan", "East China Sea", "Seto Inland Sea", "Sea of Okhotsk", "Gulf of Thailand", "Gulf of California", "San Francisco Bay", "South China Sea", "Sulu Sea", "Solomon Sea", "Pacific Ocean", "Sulawesi Sea", "Coral Sea", "Malakka Strait", "Tasman Sea", "Java Sea", "Arafura Sea", "Banda Sea", "Bering Sea", "Savu Sea", "Timor Sea", "Andaman Sea", "Indian Ocean", "Gulf of Bengal", "Gulf of Aden", "Red Sea", "Arabian Sea", "Chukchi Sea", "Gulf of Oman", "Persian Gulf", "East Sibirian Sea", "Laptev Sea", "Kara Sea", "Arctic Ocean", "Barents Sea", "White Sea", "Hudson Bay", "Labrador Sea", "Baffin Bay", "Greenland Sea", "Norwegian Sea", "Atlantic Ocean", "Irish Sea", "The Channel", "North Sea", "Gulf of Mexico", "Caribbean Sea", "Lago de Maracaibo", "Mediterranean Sea", "Skagerrak", "Kattegat", "Baltic Sea", "Marmara Sea", "Black Sea", "Sea of Azov"];
  const DEG         = [2, 5, 4, 2, 2, 1, 1, 1, 6, 3, 2, 15, 4, 4, 2, 3, 5, 3, 7, 2, 4, 4, 3, 11, 2, 3, 1, 3, 3, 2, 1, 3, 3, 3, 8, 4, 1, 3, 4, 2, 3, 4, 10, 1, 2, 4, 2, 3, 1, 2, 2, 2, 1, 2, 2, 1];
  const LINKS       = [{"i": 23, "j": 42, "w": 1.0}, {"i": 11, "j": 23, "w": 1.0}, {"i": 1, "j": 11, "w": 1.0}, {"i": 19, "j": 28, "w": 1.0}, {"i": 2, "j": 11, "w": 1.0}, {"i": 11, "j": 19, "w": 1.0}, {"i": 3, "j": 11, "w": 1.0}, {"i": 15, "j": 23, "w": 1.0}, {"i": 14, "j": 22, "w": 1.0}, {"i": 8, "j": 16, "w": 1.0}, {"i": 42, "j": 49, "w": 1.0}, {"i": 4, "j": 11, "w": 1.0}, {"i": 16, "j": 23, "w": 1.0}, {"i": 11, "j": 18, "w": 1.0}, {"i": 34, "j": 40, "w": 1.0}, {"i": 28, "j": 34, "w": 1.0}, {"i": 35, "j": 41, "w": 1.0}, {"i": 2, "j": 8, "w": 1.0}, {"i": 8, "j": 14, "w": 1.0}, {"i": 12, "j": 18, "w": 1.0}, {"i": 42, "j": 47, "w": 1.0}, {"i": 45, "j": 50, "w": 1.0}, {"i": 6, "j": 11, "w": 1.0}, {"i": 18, "j": 23, "w": 1.0}, {"i": 38, "j": 42, "w": 1.0}, {"i": 42, "j": 46, "w": 1.0}, {"i": 49, "j": 53, "w": 1.0}, {"i": 41, "j": 45, "w": 1.0}, {"i": 34, "j": 38, "w": 1.0}, {"i": 7, "j": 11, "w": 1.0}, {"i": 11, "j": 15, "w": 1.0}, {"i": 23, "j": 27, "w": 1.0}, {"i": 12, "j": 16, "w": 1.0}, {"i": 16, "j": 20, "w": 1.0}, {"i": 17, "j": 21, "w": 1.0}, {"i": 13, "j": 17, "w": 1.0}, {"i": 42, "j": 45, "w": 1.0}, {"i": 31, "j": 34, "w": 1.0}, {"i": 34, "j": 37, "w": 1.0}, {"i": 28, "j": 31, "w": 1.0}, {"i": 8, "j": 11, "w": 1.0}, {"i": 1, "j": 4, "w": 1.0}, {"i": 5, "j": 8, "w": 1.0}, {"i": 20, "j": 23, "w": 1.0}, {"i": 18, "j": 21, "w": 1.0}, {"i": 9, "j": 12, "w": 1.0}, {"i": 10, "j": 13, "w": 1.0}, {"i": 42, "j": 44, "w": 1.0}, {"i": 40, "j": 42, "w": 1.0}, {"i": 32, "j": 34, "w": 1.0}, {"i": 33, "j": 35, "w": 1.0}, {"i": 37, "j": 39, "w": 1.0}, {"i": 9, "j": 11, "w": 1.0}, {"i": 1, "j": 3, "w": 1.0}, {"i": 0, "j": 2, "w": 1.0}, {"i": 21, "j": 23, "w": 1.0}, {"i": 27, "j": 29, "w": 1.0}, {"i": 25, "j": 27, "w": 1.0}, {"i": 23, "j": 25, "w": 1.0}, {"i": 22, "j": 24, "w": 1.0}, {"i": 16, "j": 18, "w": 1.0}, {"i": 18, "j": 20, "w": 1.0}, {"i": 11, "j": 13, "w": 1.0}, {"i": 13, "j": 15, "w": 1.0}, {"i": 42, "j": 43, "w": 1.0}, {"i": 41, "j": 42, "w": 1.0}, {"i": 53, "j": 54, "w": 1.0}, {"i": 54, "j": 55, "w": 1.0}, {"i": 44, "j": 45, "w": 1.0}, {"i": 50, "j": 51, "w": 1.0}, {"i": 51, "j": 52, "w": 1.0}, {"i": 40, "j": 41, "w": 1.0}, {"i": 34, "j": 35, "w": 1.0}, {"i": 33, "j": 34, "w": 1.0}, {"i": 35, "j": 36, "w": 1.0}, {"i": 32, "j": 33, "w": 1.0}, {"i": 31, "j": 32, "w": 1.0}, {"i": 37, "j": 38, "w": 1.0}, {"i": 38, "j": 39, "w": 1.0}, {"i": 46, "j": 47, "w": 1.0}, {"i": 47, "j": 48, "w": 1.0}, {"i": 11, "j": 12, "w": 1.0}, {"i": 10, "j": 11, "w": 1.0}, {"i": 0, "j": 1, "w": 1.0}, {"i": 1, "j": 2, "w": 1.0}, {"i": 8, "j": 9, "w": 1.0}, {"i": 29, "j": 30, "w": 1.0}, {"i": 25, "j": 26, "w": 1.0}, {"i": 23, "j": 24, "w": 1.0}, {"i": 22, "j": 23, "w": 1.0}, {"i": 20, "j": 21, "w": 1.0}, {"i": 17, "j": 18, "w": 1.0}];
  const N           = 56;
  const VALUE_LABEL = "count";

  if (N === 0) {
    document.getElementById("chart-wrap").textContent = "No data to display.";
    return;
  }

  // ---- layout constants ----
  const LEFT_PAD    = 40;
  const RIGHT_PAD   = 40;
  const TOP_PAD     = 18;
  const BOTTOM_PAD  = 24;
  const NODE_STEP   = Math.max(14, Math.min(40, Math.floor(900 / Math.max(N, 1))));
  const AXIS_WIDTH  = LEFT_PAD + (N - 1) * NODE_STEP + RIGHT_PAD;

  // x-position of node i
  function xPos(i) { return LEFT_PAD + i * NODE_STEP; }

  // Compute maxR from actual links
  let maxR = 0;
  LINKS.forEach(function (l) {
    const r = Math.abs(xPos(l.j) - xPos(l.i)) / 2;
    if (r > maxR) maxR = r;
  });

  // Estimate label space: longest label * approx char width at 9px
  const maxLabelLen = NAMES.reduce(function (m, n) { return Math.max(m, n.length); }, 0);
  const LABEL_SPACE = Math.min(maxLabelLen * 5.5 + 8, 140);

  const BASE_Y   = maxR + TOP_PAD;
  const SVG_H    = BASE_Y + LABEL_SPACE + BOTTOM_PAD;
  const SVG_W    = AXIS_WIDTH;

  // ---- scales ----
  const maxDeg = d3.max(DEG) || 1;
  const minDeg = d3.min(DEG) || 0;

  const rScale = d3.scaleSqrt()
    .domain([0, maxDeg])
    .range([2, 9]);

  const colourScale = d3.scaleSequential()
    .domain([0, maxDeg])
    .interpolator(d3.interpolateViridis);

  const maxW = d3.max(LINKS, function (l) { return l.w; }) || 1;
  const strokeScale = d3.scaleSqrt()
    .domain([0, maxW])
    .range([0.6, 5]);

  // ---- SVG ----
  const svg = d3.select("#arc-svg")
    .attr("width",  SVG_W)
    .attr("height", SVG_H);

  // ---- tooltip ----
  const tooltip = d3.select("#tooltip");
  function showTip(content) { tooltip.style("display", "block").html(content); }
  function moveTip(event) {
    tooltip
      .style("left", (event.clientX + 14) + "px")
      .style("top",  (event.clientY - 10) + "px");
  }
  function hideTip() { tooltip.style("display", "none"); }

  // ---- axis baseline ----
  svg.append("line")
    .attr("class", "axis-line")
    .attr("x1", LEFT_PAD - 10)
    .attr("y1", BASE_Y)
    .attr("x2", LEFT_PAD + (N - 1) * NODE_STEP + 10)
    .attr("y2", BASE_Y);

  // ---- arcs ----
  // Build adjacency: node -> set of neighbour indices, for highlight
  const adjSet = new Map();
  NAMES.forEach(function (_, i) { adjSet.set(i, new Set()); });
  LINKS.forEach(function (l) {
    adjSet.get(l.i).add(l.j);
    adjSet.get(l.j).add(l.i);
  });

  const arcSel = svg.append("g")
    .attr("class", "arcs")
    .selectAll("path")
    .data(LINKS)
    .join("path")
      .attr("class", "arc-path")
      .attr("d", function (l) {
        const x1 = xPos(l.i);
        const x2 = xPos(l.j);
        const r  = Math.abs(x2 - x1) / 2;
        return "M " + x1 + "," + BASE_Y +
               " A " + r + "," + r + " 0 0,1 " + x2 + "," + BASE_Y;
      })
      .attr("stroke", "#3a7abf")
      .attr("stroke-width", function (l) { return strokeScale(l.w); })
      .attr("stroke-opacity", 0.35)
      .on("mouseover", function (event, l) {
        const val = l.w.toLocaleString(undefined, { maximumFractionDigits: 2 });
        showTip(
          "<strong>" + NAMES[l.i] + "</strong>" +
          " &harr; <strong>" + NAMES[l.j] + "</strong>" +
          "<br/>" + VALUE_LABEL + ": <strong>" + val + "</strong>"
        );
        moveTip(event);
        arcSel.classed("dimmed", function (r) { return r !== l; })
              .classed("highlighted", function (r) { return r === l; });
        nodeSel.classed("dimmed", function (_, k) {
          return k !== l.i && k !== l.j;
        });
        labelSel.classed("dimmed", function (_, k) {
          return k !== l.i && k !== l.j;
        });
      })
      .on("mousemove", moveTip)
      .on("mouseout", function () {
        hideTip();
        arcSel.classed("dimmed", false).classed("highlighted", false);
        nodeSel.classed("dimmed", false);
        labelSel.classed("dimmed", false);
      });

  // ---- nodes ----
  const nodeSel = svg.append("g")
    .attr("class", "nodes")
    .selectAll("circle")
    .data(NAMES)
    .join("circle")
      .attr("class", "node-circle")
      .attr("cx", function (_, i) { return xPos(i); })
      .attr("cy", BASE_Y)
      .attr("r",  function (_, i) { return rScale(DEG[i]); })
      .attr("fill", function (_, i) { return colourScale(DEG[i]); })
      .on("mouseover", function (event, name) {
        const i = NAMES.indexOf(name);
        const deg = DEG[i];
        showTip(
          "<strong>" + name + "</strong>" +
          "<br/>Degree: <strong>" + deg + "</strong>"
        );
        moveTip(event);
        const nbrs = adjSet.get(i);
        arcSel.classed("dimmed", function (l) {
          return l.i !== i && l.j !== i;
        }).classed("highlighted", false);
        nodeSel.classed("dimmed", function (_, k) {
          return k !== i && !nbrs.has(k);
        });
        labelSel.classed("dimmed", function (_, k) {
          return k !== i && !nbrs.has(k);
        });
      })
      .on("mousemove", moveTip)
      .on("mouseout", function () {
        hideTip();
        arcSel.classed("dimmed", false).classed("highlighted", false);
        nodeSel.classed("dimmed", false);
        labelSel.classed("dimmed", false);
      });

  // ---- labels ----
  // Thin labels when nodes are dense: show every k-th or degree >= threshold
  let labelStep = 1;
  if (N > 80)  labelStep = 4;
  else if (N > 40) labelStep = 2;

  const degThreshold = (N > 60) ? Math.ceil(maxDeg * 0.15) : 0;

  const labelSel = svg.append("g")
    .attr("class", "labels")
    .selectAll("text")
    .data(NAMES)
    .join("text")
      .attr("class", "node-label")
      .attr("x", function (_, i) { return xPos(i); })
      .attr("y", BASE_Y + 4)
      .attr("transform", function (_, i) {
        const x = xPos(i);
        return "rotate(90," + x + "," + (BASE_Y + 4) + ")";
      })
      .attr("text-anchor", "start")
      .attr("display", function (_, i) {
        if (DEG[i] >= degThreshold && i % labelStep === 0) return null;
        if (DEG[i] > degThreshold) return null;
        return "none";
      })
      .text(function (d) { return d; });

  // ---- BBox refit ----
  // After all marks are drawn, refit the SVG to its actual content
  try {
    const bbox = svg.node().getBBox();
    const pad  = 10;
    svg
      .attr("viewBox",
        (bbox.x - pad) + " " + (bbox.y - pad) + " " +
        (bbox.width + 2 * pad) + " " + (bbox.height + 2 * pad)
      )
      .attr("width",  bbox.width  + 2 * pad)
      .attr("height", bbox.height + 2 * pad);
  } catch (e) {
    // getBBox may fail in non-browser environments; ignore
  }

})();
</script>
</body>
</html>
