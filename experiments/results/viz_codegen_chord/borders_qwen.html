const width = 960;
const height = 600;
const radius = Math.min(width, height) / 2;
const svg = d3.select("svg");
const g = svg.append("g").attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");

const color = d3.scaleOrdinal(d3.schemeCategory10);

const chordLayout = d3.chord()
  .padAngle(0.02)
  .sortSubgroups(d3.descending);

const chords = chordLayout(matrix);

const arc = d3.arc()
  .innerRadius(radius * 0.4)
  .outerRadius(radius * 0.5);

const ribbon = d3.ribbon()
  .radius(radius * 0.4);

const tooltip = d3.select("#tooltip");

g.selectAll("path").data(chords.groups).enter().append("path")
  .attr("fill", (d, i) => color(i))
  .attr("d", arc)
  .on("mouseover", (event, d) => {
    // Highlight related chords
    d3.selectAll(".chord").filter((_, i) => {
      return d3.select(this).datum().index === i || d3.select(this).datum().index === chords.groups[i].index;
    }).raise().attr("opacity", 1.0);
    d3.selectAll(".chord").filter((_, i) => {
      return d3.select(this).datum().index !== i && d3.select(this).datum().index !== chords.groups[i].index;
    }).attr("opacity", 0.2);
    // Show tooltip
    tooltip.classed("show", true);
    tooltip.style("left", event.pageX + 10 + "px");
    tooltip.style("top", event.pageY + 10 + "px");
    tooltip.html(htmlEscape(names[d.index]));
  })
  .on("mouseout", () => {
    d3.selectAll(".chord").attr("opacity", 1.0);
    tooltip.classed("show", false);
  });

g.selectAll(".chord").data(chords).enter().append("path")
  .attr("class", "chord")
  .attr("d", ribbon)
  .style("fill", (d) => color(d.source.index))
  .on("mouseover", (event, d) => {
    // Highlight related arcs and chords
    d3.selectAll("path").filter((_, i) => {
      return d.source.index === i || d.target.index === i;
    }).raise().attr("opacity", 1.0);
    d3.selectAll("path").filter((_, i) => {
      return d.source.index !== i && d.target.index !== i;
    }).attr("opacity", 0.2);
    // Show tooltip
    tooltip.classed("show", true);
    tooltip.style("left", event.pageX + 10 + "px");
    tooltip.style("top", event.pageY + 10 + "px");
    tooltip.html(htmlEscape(names[d.source.index] + " - " + names[d.target.index] + "\nValue: " + d.value));
  })
  .on("mouseout", () => {
    d3.selectAll("path").attr("opacity", 1.0);
    tooltip.classed("show", false);
  });

g.selectAll("text").data(chords.groups).enter().append("text")
  .attr("transform", (d) => {
    const x = d.startAngle + d.endAngle >> 1;
    const y = radius * 0.4 + 8;
    const dx = Math.cos(x) * y;
    const dy = Math.sin(x) * y;
    return "translate(" + dx + "," + dy + ") rotate(" + (x * 180 / Math.PI - 90) + ")";
  })
  .attr("dy", "0.35em")
  .attr("text-anchor", (d) => {
    const x = d.startAngle + d.endAngle >> 1;
    return Math.cos(x) > 0 ? "start" : "end";
  })
  .text((d) => htmlEscape(names[d.index]));

function htmlEscape(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
