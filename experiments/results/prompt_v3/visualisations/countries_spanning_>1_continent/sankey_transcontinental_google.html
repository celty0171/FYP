<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcontinental Countries (Sankey)</title>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle { color: #555; margin-top: 0; font-size: 13px; }
  #sankey { width: 100%; height: 480px; }
</style>
</head>
<body>
  <h1>Transcontinental Countries &rarr; Continents</h1>
  <p class="subtitle">Only countries spanning more than one continent. Flow width = percentage of country on each continent (source: country, target: continent, weight: percentage).</p>
  <div id="sankey"></div>

  <script type="text/javascript">
    // Inline data: [source = country code, target = continent, weight = percentage]
    var RAW_DATA = [
  [
    "R",
    "Europe",
    23.15
  ],
  [
    "R",
    "Asia",
    76.85
  ],
  [
    "TR",
    "Europe",
    3
  ],
  [
    "TR",
    "Asia",
    97
  ],
  [
    "KZ",
    "Europe",
    5.4
  ],
  [
    "KZ",
    "Asia",
    94.6
  ],
  [
    "RI",
    "Asia",
    78
  ],
  [
    "RI",
    "Australia/Oceania",
    22
  ],
  [
    "ET",
    "Asia",
    7.3
  ],
  [
    "ET",
    "Africa",
    92.7
  ]
];

    google.charts.load('current', {packages: ['sankey']});
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {
      var data = new google.visualization.DataTable();
      data.addColumn('string', 'Country');     // source
      data.addColumn('string', 'Continent');   // target
      data.addColumn('number', 'Percentage');  // weight
      data.addRows(RAW_DATA);

      var options = {
        sankey: {
          node: {
            label: { fontName: 'Arial', fontSize: 13, color: '#1a1a1a' },
            nodePadding: 18,
            width: 16,
            interactivity: true
          },
          link: { colorMode: 'gradient' }
        }
      };

      var chart = new google.visualization.Sankey(document.getElementById('sankey'));
      chart.draw(data, options);
    }
  </script>
</body>
</html>
