    // Build unique node list and link list, preserving mapping exactly.
    var nameToIndex = {};
    var nodes = [];
    function nodeIndex(name) {
      if (!(name in nameToIndex)) {
        nameToIndex[name] = nodes.length;
        nodes.push({ name: name });
      }
      return nameToIndex[name];
    }
    var links = RAW_DATA.map(function(d) {
      return {
        source: nodeIndex(d[0]),   // country
        target: nodeIndex(d[1]),   // continent
        value: d[2]                // percentage
      };
    });

    var graph = { nodes: nodes, links: links };

    var width = 900;
    var nodeCount = nodes.length;
    var height = Math.max(600, nodeCount * 12);

    var svg = d3.select("#chart").append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", [0, 0, width, height]);

    var sankey = d3.sankey()
      .nodeWidth(14)
      .nodePadding(6)
      .extent([[10, 10], [width - 10, height - 10]]);

    sankey(graph);

    var color = d3.scaleOrdinal(d3.schemeCategory10);

    // Links
    svg.append("g")
      .attr("fill", "none")
      .selectAll("path")
      .data(graph.links)
      .join("path")
        .attr("class", "link")
        .attr("d", d3.sankeyLinkHorizontal())
        .attr("stroke", function(d) { return color(d.target.name); })
        .attr("stroke-width", function(d) { return Math.max(1, d.width); })
        .attr("stroke-opacity", 0.4)
      .append("title")
        .text(function(d) { return d.source.name + " \u2192 " + d.target.name + "\n" + d.value + "%"; });

    // Nodes
    var node = svg.append("g")
      .selectAll("g")
      .data(graph.nodes)
      .join("g");

    node.append("rect")
        .attr("x", function(d) { return d.x0; })
        .attr("y", function(d) { return d.y0; })
        .attr("height", function(d) { return Math.max(1, d.y1 - d.y0); })
        .attr("width", function(d) { return d.x1 - d.x0; })
        .attr("fill", function(d) { return color(d.name); })
        .attr("stroke", "#333")
      .append("title")
        .text(function(d) { return d.name + "\n" + d.value + "%"; });

    node.append("text")
        .attr("class", "node-label")
        .attr("x", function(d) { return d.x0 < width / 2 ? d.x1 + 4 : d.x0 - 4; })
        .attr("y", function(d) { return (d.y1 + d.y0) / 2; })
        .attr("dy", "0.35em")
        .attr("text-anchor", function(d) { return d.x0 < width / 2 ? "start" : "end"; })
        .text(function(d) { return d.name; });
