    function drawChart() {
      var data = new google.visualization.DataTable();
      data.addColumn('string', 'Country');     // source
      data.addColumn('string', 'Continent');   // target
      data.addColumn('number', 'Percentage');  // weight
      data.addRows(RAW_DATA);

      var options = {
        sankey: {
          node: {
            label: { fontName: 'Arial', fontSize: 11, color: '#1a1a1a', bold: false },
            nodePadding: 6,
            width: 14,
            interactivity: true
          },
          link: {
            colorMode: 'gradient'
          }
        }
      };

      var chart = new google.visualization.Sankey(document.getElementById('sankey'));
      chart.draw(data, options);
    }
