<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South America: Country to Continent (Sankey)</title>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle { color: #555; margin-top: 0; font-size: 13px; }
  #sankey { width: 100%; height: 560px; }
</style>
</head>
<body>
  <h1>South America &mdash; Country to Continent Membership</h1>
  <p class="subtitle">Only rows where continent = "South America". Flow width = percentage of country on the continent (source: country, target: continent, weight: percentage).</p>
  <div id="sankey"></div>

  <script type="text/javascript">
    // Inline data: [source = country code, target = continent, weight = percentage]
    var RAW_DATA = [
  [
    "NLB",
    "South America",
    100
  ],
  [
    "CUR",
    "South America",
    100
  ],
  [
    "ARU",
    "South America",
    100
  ],
  [
    "YV",
    "South America",
    100
  ],
  [
    "GUY",
    "South America",
    100
  ],
  [
    "SME",
    "South America",
    100
  ],
  [
    "GF",
    "South America",
    100
  ],
  [
    "CO",
    "South America",
    100
  ],
  [
    "EC",
    "South America",
    100
  ],
  [
    "PE",
    "South America",
    100
  ],
  [
    "BOL",
    "South America",
    100
  ],
  [
    "RCH",
    "South America",
    100
  ],
  [
    "RA",
    "South America",
    100
  ],
  [
    "PY",
    "South America",
    100
  ],
  [
    "ROU",
    "South America",
    100
  ],
  [
    "BR",
    "South America",
    100
  ],
  [
    "FALK",
    "South America",
    100
  ]
];

    google.charts.load('current', {packages: ['sankey']});
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {
      var data = new google.visualization.DataTable();
      data.addColumn('string', 'Country');     // source
      data.addColumn('string', 'Continent');   // target
      data.addColumn('number', 'Percentage');  // weight
      data.addRows(RAW_DATA);

      var options = {
        sankey: {
          node: {
            label: { fontName: 'Arial', fontSize: 12, color: '#1a1a1a' },
            nodePadding: 12,
            width: 16,
            interactivity: true
          },
          link: { colorMode: 'source' }
        }
      };

      var chart = new google.visualization.Sankey(document.getElementById('sankey'));
      chart.draw(data, options);
    }
  </script>
</body>
</html>
