<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lakes: depth vs elevation, area = dam_height (bubble)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 16px; }
  h1 { font-size: 18px; margin-bottom: 2px; }
  #sub { color: #555; font-size: 12px; margin: 0 0 8px; }
  .domain, .tick line { stroke: #ccc; }
  #tip { position: absolute; opacity: 0; pointer-events: none; background: rgba(0,0,0,0.82);
         color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; line-height: 1.4; }
</style>
</head>
<body>
<h1>Lakes: depth vs elevation, area = dam_height (bubble)</h1>
<p id="sub">One point per name: x = elevation, y = depth, area = dam_height. 22 instances.</p>
<div id="chart"></div>
<div id="tip"></div>
<script>
const data = [{"label": "Lac de Serre-Pon\u00e7on", "x": 785.0, "y": 120.0, "size": 124.0}, {"label": "Orava Reservoir", "x": 601.0, "y": 38.0, "size": 28.0}, {"label": "Kama Reservoir", "x": 108.5, "y": 30.0, "size": 37.0}, {"label": "Lower Kama Reservoir", "x": 63.0, "y": 41.0, "size": 30.0}, {"label": "Novosibirsk Reservoir", "x": 114.0, "y": 25.0, "size": 33.0}, {"label": "Lake Kainji", "x": 140.0, "y": 12.0, "size": 65.0}, {"label": "Barrage de Mbakaou", "x": 838.0, "y": 29.0, "size": 19.0}, {"label": "Lake Cahora-Bassa", "x": 326.0, "y": 157.0, "size": 171.0}, {"label": "Lake Kariba", "x": 479.0, "y": 97.0, "size": 128.0}, {"label": "Lake Manicouagan", "x": 360.0, "y": 350.0, "size": 214.0}, {"label": "Kentucky Lake", "x": 375.0, "y": 23.0, "size": 63.0}, {"label": "Chickamauga Lake", "x": 710.0, "y": 22.0, "size": 39.0}, {"label": "Lake Oroville", "x": 275.0, "y": 274.0, "size": 235.0}, {"label": "Lake Powell", "x": 1127.0, "y": 171.0, "size": 216.0}, {"label": "Lake Mead", "x": 372.0, "y": 180.0, "size": 221.0}, {"label": "Fort Peck Lake", "x": 690.0, "y": 67.0, "size": 76.0}, {"label": "Lake Sakakawea", "x": 554.0, "y": 55.0, "size": 64.0}, {"label": "Lake Oahe", "x": 502.0, "y": 62.0, "size": 75.0}, {"label": "Lago de Sobradinho", "x": 392.0, "y": 30.0, "size": 41.0}, {"label": "Lake Eucumbene", "x": 1200.0, "y": 107.0, "size": 116.0}, {"label": "Lake Jindabyne", "x": 915.0, "y": 40.0, "size": 72.0}, {"label": "Lake Hume", "x": 192.0, "y": 40.0, "size": 51.0}];
const xName = "elevation", yName = "depth";
const sizeName = "dam_height", colorName = null;
const width = 920, height = 640;

const margin = {top: 24, right: 30, bottom: 52, left: 64};
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

const x = d3.scaleLinear().domain(d3.extent(data, d => d.x)).nice().range([0, innerW]);
const y = d3.scaleLinear().domain(d3.extent(data, d => d.y)).nice().range([innerH, 0]);
const rScale = sizeName ? d3.scaleSqrt().domain([0, d3.max(data, d => d.size) || 1]).range([3, 22]) : null;
const colorVals = colorName ? Array.from(new Set(data.map(d => d.color))) : [];
const color = colorName ? d3.scaleOrdinal(colorVals, d3.schemeCategory10) : null;

g.append("g").attr("transform", `translate(0,${innerH})`).call(d3.axisBottom(x).ticks(8));
g.append("g").call(d3.axisLeft(y).ticks(8));
g.append("text").attr("x", innerW / 2).attr("y", innerH + 40).attr("text-anchor", "middle").attr("font-size", "11px").text(xName);
g.append("text").attr("transform", "rotate(-90)").attr("x", -innerH / 2).attr("y", -48).attr("text-anchor", "middle").attr("font-size", "11px").text(yName);

const tip = d3.select("#tip");
const moveTip = (event) => tip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY + 12) + "px");

// Draw larger bubbles first so small ones are not hidden.
const drawData = rScale ? data.slice().sort((a, b) => b.size - a.size) : data;
const dot = g.append("g").selectAll("circle").data(drawData).join("circle")
  .attr("cx", d => x(d.x))
  .attr("cy", d => y(d.y))
  .attr("r", d => rScale ? rScale(d.size) : 4)
  .attr("fill", d => color ? color(d.color) : "#4a78b5")
  .attr("fill-opacity", 0.7)
  .attr("stroke", "#fff");

dot
  .on("mouseover", (event, d) => {
    dot.attr("fill-opacity", p => p === d ? 1 : 0.12);
    let v = "<strong>" + d.label + "</strong><br>" + xName + ": " + d.x + "<br>" + yName + ": " + d.y;
    if (sizeName) v += "<br>" + sizeName + ": " + d.size;
    if (colorName) v += "<br>" + colorName + ": " + d.color;
    tip.style("opacity", 1).html(v);
    moveTip(event);
  })
  .on("mousemove", moveTip)
  .on("mouseout", () => { dot.attr("fill-opacity", 0.7); tip.style("opacity", 0); });
</script>
</body>
</html>
