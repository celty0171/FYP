      .attr("y", 6)
      .attr("dy", "0.71em")
      .attr("text-anchor", "end")
      .text("Population");

      .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.code))
      .attr("y", d => y(d.population))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.population));
