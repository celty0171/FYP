      fill-opacity: 0.9;
      shape-render: crispEdges;
    }
    .node text {
      pointer-events: none;
      text-anchor: middle;
    }
    .link {
      fill: none;
      stroke: #000;
      stroke-opacity: 0.2;
    }
    .link:hover {
      stroke-opacity: 0.5;
    }

      {"country": "PAL", "continent": "Australia/Oceania", "percentage": 100}
    ];

    const svg = d3.select("svg"),
      width = +svg.attr("width"),
      height = +svg.attr("height");

    const format = d3.format(",.0f");

    const link = svg.append("g").attr("class", "links");
    const node = svg.append("g").attr("class", "nodes");

    const sankey = d3.sankey()
      .nodeWidth(30)
      .nodePadding(10)
      .size([width, height]);

    const graph = {
      nodes: [],
      links: []
    };

    // Create nodes
    const nodeMap = {};
    data.forEach(d => {
      if (!nodeMap[d.country]) {
        nodeMap[d.country] = { name: d.country };
      }
      if (!nodeMap[d.continent]) {
        nodeMap[d.continent] = { name: d.continent };
      }
    });

    graph.nodes = Object.values(nodeMap);

    // Create links
    data.forEach(d => {
      graph.links.push({
        source: nodeMap[d.country],
        target: nodeMap[d.continent],
        value: d.percentage
      });
    });

    sankey(graph);

    const linkData = link.selectAll(".link")
      .data(graph.links)
      .enter().append("path")
      .attr("class", "link")
      .attr("d", d3.sankey.link())
      .style("stroke-width", d => Math.max(1, d.width))
      .append("title")
      .text(d => `${d.source.name} → ${d.target.name}\n${format(d.value)}`);

    const nodeData = node.selectAll(".node")
      .data(graph.nodes)
      .enter().append("g")
      .attr("class", "node")
      .attr("transform", d => `translate(${d.x0},${d.y0})`);

    nodeData.append("rect")
      .attr("width", d => d.x1 - d.x0)
      .attr("height", d => d.y1 - d.y0)
      .attr("fill", d => d.color || "steelblue");

    nodeData.append("text")
      .attr("x", d => d.x1 - d.x0 + 4)
      .attr("y", d => (d.y1 - d.y0) / 2)
      .attr("dy", ".35em")
      .attr("text-anchor", "start")
      .text(d => d.name);
