      {"country": "FL", "name": "Albanian", "percentage": 1.1},
      {"country": "A", "name": "Austrian", "percentage": 85}
    ];

    const svg = d3.select("svg"),
      width = +svg.attr("width"),
      height = +svg.attr("height");

    const margin = { top: 20, right: 30, bottom: 30, left: 40 },
      widthInner = width - margin.left - margin.right,
      heightInner = height - margin.top - margin.bottom;

    const x = d3.scaleBand()
      .range([0, widthInner])
      .padding(0.1);

    const y = d3.scaleLinear()
      .range([heightInner, 0]);

    const color = d3.scaleOrdinal()
      .range(d3.schemeCategory10);

    const stack = d3.stack()
      .offset(d3.stackOffsetExpand)
      .order(d3.stackOrderNone);

    const keys = d3.map(data, d => d.name).keys();

    const groupedData = d3.rollup(data, v => v, d => d.country, d => d.name)
      .map(([country, name], values) => ({
        country,
        name,
        percentage: values[0].percentage
      }));

    const countries = d3.map(groupedData, d => d.country).keys();

    const layers = d3.groups(groupedData, d => d.country)
      .map(([country, group]) => {
        return group.map(d => ({ name: d.name, value: d.percentage }));
      });

    const stackedData = stack(layers);

    x.domain(countries);
    y.domain([0, d3.max(stackedData, layer => d3.max(layer, d => d[1]))]);

    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const bar = g.selectAll(".group")
      .data(stackedData)
      .enter().append("g")
      .attr("class", "group")
      .attr("fill", (d, i) => color(i))
      .attr("data-country", d => d.key);

    bar.selectAll("rect")
      .data(d => d)
      .enter().append("rect")
      .attr("x", d => x(d.key))
      .attr("y", d => y(d[1]))
      .attr("height", d => y(d[0]) - y(d[1]))
      .attr("width", x.bandwidth());

    const xAxis = g.append("g")
      .attr("transform", `translate(0,${heightInner})`)
      .call(d3.axisBottom(x))
      .selectAll("text")
      .attr("transform", "rotate(-45)")
      .style("text-anchor", "end");

    const yAxis = g.append("g")
      .call(d3.axisLeft(y));

    const legend = g.append("g")
      .attr("transform", `translate(${widthInner + 10},0)`);

    legend.selectAll("rect")
      .data(keys)
      .enter().append("rect")
      .attr("x", 0)
      .attr("y", (d, i) => i * 20)
      .attr("width", 18)
      .attr("height", 18)
      .attr("fill", (d, i) => color(i));

    legend.selectAll("text")
      .data(keys)
      .enter().append("text")
      .attr("x", 24)
      .attr("y", (d, i) => i * 20 + 9)
      .attr("dy", ".35em")
      .text(d => d);
