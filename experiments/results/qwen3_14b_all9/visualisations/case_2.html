      .range([height, 0]);

    const filteredData = data.filter(d => d.gdp !== null);

    x.domain(filteredData.map(d => d.country));
    y.domain([0, d3.max(filteredData, d => d.gdp)]);

      .attr("dy", "0.71em")
      .attr("text-anchor", "end")

      .attr("class", "bar")
      .attr("x", d => x(d.country))
      .attr("y", d => y(d.gdp))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.gdp));
