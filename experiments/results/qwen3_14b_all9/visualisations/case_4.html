      {"abbreviation": "OECD", "established": "1960-12-14"}

    const svg = d3.select("svg"),
      width = +svg.attr("width"),
      height = +svg.attr("height");

    const margin = { top: 20, right: 30, bottom: 50, left: 50 },
      innerWidth = width - margin.left - margin.right,
      innerHeight = height - margin.top - margin.bottom;

    const x = d3.scaleBand()
      .range([0, innerWidth])
      .padding(0.1);

    const y = d3.scaleLinear()
      .range([innerHeight, 0]);

    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    // Parse the date
    const parseDate = d3.timeParse("%Y-%m-%d");

    // Filter out entries with null established date
    const filteredData = data.filter(d => d.established !== null);

    // Extract the years
    const years = filteredData.map(d => parseDate(d.established).getFullYear());

    // Set the domains
    x.domain(filteredData.map(d => d.abbreviation));
    y.domain([d3.min(years), d3.max(years)]);

    // Create bars
    g.selectAll(".bar")
      .data(filteredData)
      .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.abbreviation))
      .attr("y", d => y(parseDate(d.established).getFullYear()))
      .attr("width", x.bandwidth())
      .attr("height", d => innerHeight - y(parseDate(d.established).getFullYear()))
      .append("title")
      .text(d => d.abbreviation + " established: " + d.established);

    // Add x-axis
    g.append("g")
      .attr("transform", `translate(0,${innerHeight})`)
      .call(d3.axisBottom(x))
      .selectAll("text")
      .attr("transform", "rotate(-45)")
      .style("text-anchor", "end")
      .attr("class", "label");

    // Add y-axis
    g.append("g")
      .call(d3.axisLeft(y))
      .append("text")
      .attr("transform", "rotate(-90)")
      .attr("y", 6)
      .attr("dy", "0.71em")
      .attr("text-anchor", "end")
      .text("Established Year");

    // Add labels
    g.selectAll(".label")
      .data(filteredData)
      .enter()
      .append("text")
      .attr("x", d => x(d.abbreviation) + x.bandwidth() / 2)
      .attr("y", d => y(parseDate(d.established).getFullYear()) - 5)
      .attr("text-anchor", "middle")
      .text(d => d.abbreviation)
      .attr("class", "label");
