    const width = 960;
    const height = 600;
    const svg = d3.select("svg");

    const chord = d3.chord()
      .padding(0.02)
      .sortSubgroups(d3.descending);

    const arc = d3.arc()
      .innerRadius(200)
      .outerRadius(250);

    const ribbon = d3.ribbon()
      .radius(225);

    const matrix = d3.chordMatrix()
      .columns(Object.keys(countryMap))
      .matrix((d, i, j) => {
        const source = countryMap[d.country1];
        const target = countryMap[d.country2];
        const index = i * matrix.columns.length + j;
        return d.length;
      });

    const chords = chord(matrix);

    const g = svg.append("g")
      .attr("transform", `translate(${width / 2},${height / 2})`);

    const path = g.selectAll("path")
      .data(chords)
      .enter().append("path")
      .attr("d", ribbon)
      .style("fill", d => d3.interpolateHsl(d.source.index, d.target.index))
      .style("opacity", 0.6);

    const group = g.selectAll("g")
      .data(matrix.groups)
      .enter().append("g");

    group.append("path")
      .attr("d", arc)
      .style("fill", d => d3.interpolateHsl(d.index, d.index))
      .style("stroke", "#fff");

    group.append("text")
      .each(d => d.angle = (d.startAngle + d.endAngle) / 2)
      .attr("dy", ".35em")
      .attr("text-anchor", d => d.angle > Math.PI ? "end" : null)
      .attr("transform", d => `rotate(${d.angle * 180 / Math.PI - 90})`)
      .text(d => countryMap[matrix.columns[d.index]]);
